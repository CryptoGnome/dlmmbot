# Deploy docs to GitHub Pages (manual only).
# Free Pages needs a public repo (or paid private Pages). Don't auto-run on push
# while the repo is private — it fails configure-pages and reds the commit checks.
#
# Marketing site = docs/*.html; setup docs = VitePress build from docs-site/.

name: Deploy docs

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Build VitePress setup docs
        working-directory: docs-site
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
