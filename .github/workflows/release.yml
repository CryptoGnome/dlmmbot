# Semver release on main — run manually after develop → main is merged and tested.
# Bumps package.json, tags vX.Y.Z, publishes GitHub Release notes.

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard — main only
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Release workflow must run on branch main (got ${{ github.ref_name }})"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sanity check
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Bump version
        id: ver
        run: |
          npm version ${{ inputs.bump }} --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit, tag, push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "Release ${{ steps.ver.outputs.tag }}"
          git tag "${{ steps.ver.outputs.tag }}"
          git push origin main
          git push origin "${{ steps.ver.outputs.tag }}"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: DLMM Bot ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
