# meteora-farmer configuration.
# Every value here maps to a [bracketed] default in STRATEGY.md. Hot-reloaded on change.

[scanner]
interval_s = 60
pages = 3                  # datapi pages per sweep (100 pools/page)
copycat_ignore_h = 24      # losers of symbol dedupe ignored this long
# 2026-08-15: which of a token's pools we trade. Was "highest 24h fee/TVL",
# which — because fee/TVL is inversely proportional to TVL — structurally picks
# the THINNEST sibling (measured: 11 of 18 multi-pool mints on the board). Thin
# pools earn less (volume happens where depth is) and their TVL jitters 40-50%
# on ordinary LP moves, which is exactly what P0 tvl_drain reads as a rug
# (same token, same 4 min: $8k pool swung 51%, $67k pool 9%). Now: among the
# token's gate-passing pools of the SAME bin step, take the deepest; fee/TVL
# breaks ties only within this % of the deepest pool's TVL.
sibling_tvl_tie_pct = 25
# DB retention (2026-08-15). Nothing pruned these before: the Railway volume
# hit 83% inside a day. Every gate rejection every sweep wrote a full pool
# object (~1 KB, ~100/h) into `decisions`, and every sweep wrote ~300 rows
# into `pool_snapshots`. entered/exited rows are the audit trail — never
# pruned. skipped rows feed the dashboard funnel (longest range 30d).
# pool_snapshots is read LIMIT 1 per pool; the rest is an offline dataset.
retain_skipped_days = 30
retain_snapshots_days = 3
# 2026-08-16: the age windows above are calibrated to what the dashboard READS,
# not what the volume can HOLD. On a one-day-old install nothing was older than
# 30 days, so retention pruned zero rows and the 0.5 GB Railway volume filled to
# ENOSPC overnight. This is the hard ceiling: above it, skipped decisions and
# snapshots are trimmed oldest-first regardless of age. entered/exited rows are
# never touched. Set well under your volume size — Railway's default is 0.5 GB.
db_max_mb = 200

[gates]                    # STRATEGY.md §2.1 — pool hard gates
tvl_min_usd = 5000
tvl_max_usd = 2000000
mcap_min_usd = 100000        # hard floor
mcap_micro_max_usd = 200000  # 100-200k = micro sleeve (loss-budgeted, not Kelly-equal)
mcap_micro_score_min = 75    # vs the normal 60 sizing floor
micro_tvl_min_usd = 15000    # stricter TVL floor for micro sleeve only
micro_max_pool_share_pct = 10
micro_size_mult = 0.5        # half core Kelly size
micro_max_position_sol = 0.45
micro_max_slots = 1          # at most one micro position among max_positions
micro_deploy_cap_pct = 5     # max % of wallet in open micro sleeve
fee_tvl_24h_min_pct = 20         # %/day
fee_tvl_30m_daily_min_pct = 10   # 30m ratio annualized to daily, %/day
vol_30m_min_usd = 25000
vol_trend_min = 0.8              # vol_1h / (vol_24h/24)
base_fee_min_pct = 0.2
base_fee_max_pct = 5.0
bin_step_min_new = 80            # for tokens < 7 days old
# Fee collection preference. DLMM collect_fee_mode verified 2026-08-07:
#   0 = fees paid in both tokens, 1 = fees auto-converted to quote (SOL) only.
# "prefer_quote": quote-only pools get a score bonus, both-token pools stay
#   eligible (fees still banked to SOL at claim via swap).
# "quote_only": hard gate — only quote-only pools (~13% of pools).
# "both_only": hard gate — only both-token pools (the video's two-green-dots rule).
# "any": no gate, no bonus.
fee_collection = "prefer_quote"
quote_mints = ["So11111111111111111111111111111111111111112"]  # SOL only (meme mode)
price_divergence_max_pct = 2.0   # pool price vs Jupiter quote
max_pool_share_pct = 20          # skip if our position would exceed this % of pool TVL

[vetting]                  # STRATEGY.md §2.2 — token hard gates
# Master switches (Settings UI). Off = skip that hard fail; thresholds still apply when on.
age_min_enabled = true           # block "too young" (mint age via RugCheck, not pool age)
age_max_enabled = false          # OFF: a revived old meme with live volume is a valid pool.
                                 # The fee/volume gates already test current traction directly;
                                 # mint age was a worse proxy for the same thing. Set true to
                                 # restore the age_max_days ceiling. (age_min is the SAFETY gate.)
insider_gate_enabled = true      # block high insider / funding-cluster %
holder_gate_enabled = true       # block single-holder / top-10 concentration
rugcheck_veto_enabled = true     # block high RugCheck score (rugged flag always on)
creator_rug_enabled = true       # block creators with prior rug count
gmgn_security_enabled = true     # block honeypot / sell-tax from GMGN
gmgn_trader_tags_enabled = false   # weight-5 traders call — off by default (rate-limit headroom)
single_holder_max_pct = 15
top10_max_pct = 40
insider_cluster_max_pct = 10
rugcheck_veto_normalised = 41
age_min_minutes = 45
age_max_days = 14                # only applies when age_max_enabled = true
allow_token2022_extensions = ["metadata"]

[timing]                   # STRATEGY.md §2.3 — soft, feeds score
freefall_15m_max_pct = -20
ath_proximity_pct = 3
vol_spike_ratio = 3        # last 5m candle >= 3x trailing-hour average = ignition
vol_spike_bonus = 0.25

[score_caps]
bonus_cap_total = 10       # trending + smart-flow bonuses combined can never exceed this

[smartflow]                # GMGN smart-money/KOL global feeds -> rolling window
window_min = 30
min_wallets = 3            # distinct smart wallets buying in window for bonus
bonus_wallets = 4
min_joiners = 2            # newly-joining wallets (first buy in newest 1/3 of window)
bonus_joiners = 4
bonus_kol = 4              # any KOL buy in window
net_sell_penalty_usd = 5000  # net smart-money SELLING beyond this -> penalty
penalty_net_sell = 8

[score]                    # STRATEGY.md §2.4 — weights must sum to 100
w_fee_momentum = 30
w_turnover = 20
w_vetting_soft = 25
w_timing = 15
w_pool_structure = 10

[entry]                    # STRATEGY.md §3
fib_bottom = 0.786
max_down_pct = 50                # 2026-08-10: was 65, against a -60% P0 exit. The planner now also
                                 # derives a cap from safety_price_crash_pct (planner.ts SAFETY_MARGIN_PCT),
                                 # so this is belt-and-braces — but keep them consistent by hand too.
                                 # 5 of the first 25 entries planned -65.2% depth; on ZEUS that put 22.9%
                                 # of the position in bins P0 guaranteed would never trade.
min_down_pct = 40
max_position_accounts = 2
# Bin-array rent (~0.075 SOL each) is non-refundable when arrays are new.
# Soft budget = one array (shrink target). Hard = two arrays only if score ≥ min.
# Entry also quotes on-chain uninitialized arrays; if actual ≤ tier budget, allow.
bin_rent_budget_sol = 0.075
bin_rent_hard_sol = 0.15
bin_rent_hard_score_min = 80
# Rent is non-refundable, so it is also capped as a share of the position it
# buys. 25% of a 0.3 SOL entry IS the 0.075 soft budget — this only binds on
# smaller positions, which is the point: a scaled-down floor must not let a
# 0.05 SOL entry spend most of itself on rent. 0 = no cap.
bin_rent_max_pos_pct = 25
# Bin slippage at open: SDK maps pct -> bins via ceil(pct / (binStep/100)).
# At bin_step=100 (meme default), 1% = 1 bin — every active-bin tick fails
# ExceededBinSlippageTolerance (6004). That was 100% of 3255 sim failures in
# the error log. SDK's own default is 3 bins; 5% = 5 bins at step 100, still
# tiny vs a 40% deep bid-ask. Prefer rebuild-on-slippage in live.ts over
# widening this further.
liquidity_slippage_pct = 5.0
# Second tranche (Gmet dual-range): smaller BidAsk pocket below the primary.
tranche_enabled = true
tranche_score_min = 85
tranche_size_pct = 50
# Target depth for the deep leg (clamped by P0 safety margin in planner —
# with crash=-60 / margin=10 that floor is ~50%).
tranche_max_down_pct = 70

[manage]                   # STRATEGY.md §4
poll_s = 15
# P0 safety
safety_tvl_drop_pct = 40         # in 10 min
# 2026-08-15: a tvl_drain EXIT is cheap insurance and stays. What it no longer
# does is permanently ban the token + its creator — TVL draining is a liquidity
# condition, indistinguishable between "thin pool traded through", "LP churn in
# a pool minutes old" and a real rug. pos#5 GUNICORN banned a creator for good
# on one reading; the token then round-tripped +260% and its pool stayed the
# best fee/TVL on the board. Rug-evidence triggers (pool_dead, price_crash,
# rugcheck_flip, holder/insider) keep the permanent one-strike ban.
tvl_drain_cooldown_h = 1         # token cooldown after a tvl_drain exit (was 6; 0/12 drains were rugs, 6/12 recovered within 1h — 2026-08-19)
# Price is the tie-breaker, not volume. A pool whose price is RUNNING UP is
# having its ask-side inventory bought out — TVL falls because it is being
# traded through. A rug drains TVL alongside a price COLLAPSE. Both print heavy
# volume (a rug is a stampede), so volume cannot separate them: pos#5 GUNICORN
# drained 40% while doing $85k/30m against $8.5k TVL, price +261%, and did not
# rug. Set high on purpose — exiting early costs ~0.002 SOL, sitting in a real
# rug does not. 0 disables the veto.
tvl_drain_price_rise_veto_pct = 25
# The trigger reads "40% below the 10-min median". Below either floor here that
# median is NOISE, measured 2026-08-15 with no rug happening: a thin pool's TVL
# is a handful of LPs, so one repositioning is a 40% event (same token, same 4
# minutes: $8k pool swung 51%, $67k pool 9%); a pool younger than the window is
# measuring its own birth. Skip the drain read there — pool_dead and
# price_crash still catch a real collapse.
tvl_drain_min_tvl_usd = 20000
tvl_drain_min_pool_age_min = 20
safety_wallet_dump_pct = 3       # single holder's supply-% drop between polls
safety_new_whale_pct = 10
holder_poll_s = 120              # GMGN holder-snapshot interval per open position
safety_price_crash_pct = -60     # from entry, AT ANY AGE — there is no time window in the code
                                 # (loop.ts: `crashed` compares mark.price to entryPrice, nothing else).
                                 # This comment used to claim "in <15 min", which was never implemented.
                                 # Do NOT add the window to match: ZEUS pos#24 tripped this at 57 minutes
                                 # and exiting there was correct — holding 11 more minutes would have cost
                                 # a further ~0.031 SOL, roughly doubling the loss. The unbounded age is
                                 # the behaviour that works; the old comment was the bug.
# P1 stop loss
stop_loss_frac = 0.75            # position SOL value vs entry
# 2026-08-16: while the position is BELOW range, the stop must hold for this
# many consecutive 15s polls before P1 fires. 4680 pos#11 wicked -54% for under
# two minutes, P1 fired on one mark at -25%, and the token was +58% within the
# hour — the biggest loss on the book, on a candle that CLOSED at -20%. P5's
# grace timer exists precisely to ride out wicks; P1 was defeating it. In range
# the stop is still immediate (a real drawdown, not a wick). 4 polls = 60s.
stop_loss_sustain_polls = 4
# 2026-08-18: whether P1 counts fees already CLAIMED (realized SOL sitting in
# the wallet) in the value it compares to entry. Off (default) = P1 measures
# unrealized mark-to-market only. Audit of the 7 P1 stops with marks: 6 fired
# with fee-inclusive value at 0.84–0.97 (position had already paid us), one
# (4680) at 0.25 — a real crash. The bot LOGS what this knob would have done
# on every P1 tick either way (decision `P1_fee_offset_deferred`), so leave it
# off for a week and read the log before turning it on.
stop_loss_count_claimed_fees = false
loss_reentry_cooldown_h = 24
# P2 rotation
rotation_fee_daily_min_pct = 5
rotation_polls = 3
rotation_vol_30m_min_usd = 5000
max_age_h = 48
# P3 above range / take profit
above_range_pct = 5
above_range_sustain_min = 10          # true wins (price traveled through range) — short so follow can arm
above_range_missed_sustain_min = 45    # 2026-08-13: 18/27 P3s were near-zero churn at exactly 10m;
                                      # missed/never-converted closes paid ~0.002 SOL rent round-trip
                                      # to free a slot we weren't filling. Hold longer; volume/age still exits.
rebalance_max_per_6h = 2
rebalance_cost_max_pct_of_fees = 25
reentry_ladder_mult = 0.75
reentry_max_per_24h = 2
house_money_rule = false   # 2026-08-09: banks notional profit, never debits losses, and there is
                           # no 'release' path in the codebase — deployable only ever falls. Ledger
                           # had reached 0.1525 SOL, more than the whole measured account gain.
# P4 in range
claim_min_sol = 0.05
claim_min_txcost_mult = 20
claim_interval_h = 4
# P5 grace-start claim: bank fees the moment price drops below range, so
# token-side fees convert to SOL at the top of a dump instead of the bottom.
# Floor keeps dust claims from wasting tx fees (~10x a claim's cost).
grace_claim_min_sol = 0.005
fee_destination = "bank"         # bank | compound | hybrid
compound_score_min = 70
escape_hatch_depth_pct = 60
escape_hatch_recovery_pct = 25
# After an escape close the token is benched this long before the scanner may
# re-enter it. The escape fires BECAUSE the token just fell through 60% of our
# range; "close and reset" used to re-buy it on the next tick (3 of 6 observed
# re-entries were same-minute; net -0.10 SOL across both bots). 0 disables.
escape_reentry_cooldown_min = 30
profit_lock_enabled = true
profit_lock_at_frac = 1.30
profit_lock_withdraw_pct = 30
profit_lock_max_fires = 1
# P5 below range
below_range_grace_min = 15

[sizing]                   # STRATEGY.md §5
max_positions = 5        # 2026-08-13: raised 3→5 so concurrent meme opportunities aren't
                         # left on the table. Still well under the old 7 (70% wallet at 10%
                         # Kelly cap). Majors still keep meme_reserve_slots=2 free; micro ≤1.
min_position_sol = 0.3   # Floor for a LARGE bankroll. 0.5 made the 0.75x re-entry ladder
                         # unreachable at ~6.5 SOL bankroll (10% cap * 0.75 < 0.5).
# 2026-08-15: the floor now SCALES with equity — as a flat number it silently
# switched the bot off for small operators. Effective floor is
#   max(min_position_floor_sol, min(min_position_sol, equity * min_position_pct))
# 1 SOL -> 0.05 | 5 -> 0.05 | 10 -> 0.10 | 20 -> 0.20 | 30+ -> 0.30 (unchanged).
# Set min_position_pct = 0 to go back to the flat floor.
min_position_pct = 1.0        # floor as % of equity
min_position_floor_sol = 0.05 # hard economic floor: a new mint's token-account
                              # rent + fees measured 0.00212 SOL, ~4% of 0.05 —
                              # below this, fees cannot beat per-trade overhead.
min_reentry_sol = 0.2    # 2026-08-09: viability floor for a re-entry, checked AFTER the ladder
                         # multiplier. The 0.3 floor exists to cover per-position overhead, but
                         # the dominant piece of that was the 0.00204 SOL token-account rent, and
                         # a re-entry reuses an account it already paid for (measured: new-mint
                         # flat trade -0.00212, reused-account flat trade -0.00005). Holding
                         # re-entries to the new-mint floor made 0.3 * 0.75 = 0.225 a guaranteed
                         # skip — 336 such rows, including 3 of the 5 best trades to date.
# --- Sizing mode: kelly (default) or fixed per-sleeve SOL / % of deployable ---
mode = "kelly"                 # "kelly" | "fixed"
kelly_enabled = true           # mirror of mode=="kelly" (compat for older profiles / snapshots)
# Fixed mode (ignored when mode=kelly): each sleeve picks sol or pct of deployable
fixed_core_unit = "sol"
fixed_core_sol = 0.5
fixed_core_pct = 5
fixed_micro_unit = "sol"
fixed_micro_sol = 0.3
fixed_micro_pct = 3
fixed_majors_unit = "sol"
fixed_majors_sol = 0.75
fixed_majors_pct = 10
fixed_follow_unit = "sol"
fixed_follow_sol = 0.25
fixed_follow_pct = 2
# --- Kelly criterion sizing (learns from our own closed-position ledger) ---
kelly_fraction = 0.25          # 2026-08-09: quarter-Kelly. Half-Kelly is calibrated for a KNOWN
                               # edge; this book has not demonstrated one.
kelly_lookback = 50            # closed positions in the rolling estimate
kelly_min_samples = 50         # estimator uses REALIZED_PNL_SQL (wallet delta), not notional marks.
                               # 2026-08-13: n crossed 50; cold-start no longer applies.
kelly_cold_start_frac = 0.03   # 3% of wallet per position until enough samples
kelly_max_position_frac = 0.10 # hard cap: no position exceeds 10% of wallet
kelly_block_negative = false   # 2026-08-08: the brake is a one-way door — blocked entries
                               # produce no new closes, so f* can never recover on its own.
                               # With it off, negative edge clamps appliedFraction to 0 and
                               # sizing falls to the min_position_sol floor (0.3 SOL): small
                               # size while the sample rebuilds, rather than a permanent stop.
# Kelly per-sleeve (when mode=kelly): unit=kelly scales adaptive base; sol/pct = explicit target
kelly_core_unit = "kelly"
kelly_core_sol = 0.5
kelly_core_pct = 5
kelly_core_mult = 1.0
kelly_micro_unit = "kelly"
kelly_micro_sol = 0.3
kelly_micro_pct = 3
kelly_micro_mult = 1.0
kelly_majors_unit = "sol"
kelly_majors_sol = 0.75
kelly_majors_pct = 10
kelly_majors_mult = 1.0
kelly_follow_unit = "sol"
kelly_follow_sol = 0.25
kelly_follow_pct = 2
kelly_follow_mult = 1.0
reserve_sol = 1.0
reserve_max_pct = 25     # 2026-08-15: cap the FLAT reserve at 25% of equity. At 1.0 SOL
                         # flat, a 1 SOL wallet reserved its whole bankroll — zero
                         # deployable, zero slots, no entries, no log line. No effect at or
                         # above reserve_sol / (reserve_max_pct/100) = 4 SOL.
reserve_pct = 10
per_token_max_pct = 40
score_mult_low = 0.5             # score 60-70
score_mult_mid = 1.0             # 70-85
score_mult_high = 1.5            # 85+
circuit_daily_loss_pct = 3       # 2026-08-09: was 10. Breaker reads REALIZED_PNL_SQL.
                                 # 2026-08-12 printed -0.159 SOL realized — first day that would
                                 # have mattered at a 3% of ~24 SOL wallet (~0.73 SOL) it still
                                 # did not trip. 3% is still above the observed single-day tail.
circuit_pause_h = 12
circuit_weekly_triggers_halt = 2
# Cluster brake (2026-08-13): wallet-% breaker missed Aug 12 (−0.159).
# 2026-08-13 relax: 2-any-P0 was too tight — successful wallet_dumps and
# near-flat empties kept freezing entries. Require 4 *lossy* hard exits
# (realized ≤ −10% of entry) in 6h, pause 2h.
cluster_brake_exits = 4
cluster_brake_window_h = 6
cluster_brake_pause_h = 2
cluster_brake_loss_pct = 10
regime_filter = true
regime_sol_24h_halve_pct = -8
regime_sol_24h_pause_pct = -15

[follow]                   # up-only re-entry after a P3 up-and-out close (§4 P3-F)
# 2026-08-11: simulated over the 17 real post-exit price paths in this DB —
# unguarded chasing is negative-EV at every depth/shape (median hot-window
# retrace 26%, p75 34%); this gate set was the only one at/above breakeven at
# the measured in-range fee rate, with zero simulated stops or below-cuts.
enabled = true
min_vol_30m_usd = 100000   # arm only while the pool does 4x our normal entry floor
retrace_arm_pct = 15       # wait for this dip from the post-exit / post-high peak
range_depth_pct = 30       # bid-ask depth — tighter than the 40% default, far from "top blast"
leg_size_sol = 0.25        # small legs; the mode earns bigger sizing with its own ledger
max_legs = 3               # per chain
chain_loss_budget_sol = 0.075  # chain ends when cumulative leg PnL breaches this
chain_max_age_h = 12
cold_polls_end = 3         # consecutive polls under gates.vol_30m_min_usd ends the chain
# 2026-08-17: measured over the server bot's 15 chains. The 3 that fired a leg
# all did so within 52 min of arming (5m, 15m, 52m — all winners). The rest
# never saw a 15% dip: price drifted sideways with arm_peak == chain_high until
# volume died, one for 4.6 h. An armed chain holds the follow_active lock on
# its mint, so a chain that will never fire is a token the scanner cannot
# trade. If no dip arrives inside this window the chain ends (dip_timeout)
# and releases the mint. 0 = never time out.
awaiting_dip_max_min = 90
open_fail_cooldown_s = 300 # after a failed leg open, wait before retrying (was every 15s × 4 sims)

[majors]                   # STRATEGY.md §1.1 — spot parking, separate from meme BidAsk
enabled = true
discovery = true
discovery_pages = 8
symbol_allowlist = ["PUMP", "ANSEM", "JTO", "BONK", "WIF", "RAY", "JUP"]
mcap_min_usd = 0
age_min_days = 7
strategy_shape = "spot"            # uniform liquidity — not meme BidAsk ramp
range_below_pct = 12               # range depth below active price (%); top is always the active bin
range_above_pct = 6                # IGNORED since v0.15.0 — a SOL-only deposit cannot fund bins above price (kept so old configs still parse)
entry_rsi_period = 14
entry_rsi_max = 45                 # enter when RSI ≤ this (oversold)
entry_swing_position_max = 0.40    # or price in bottom 40% of 24h swing
entry_swing_avoid_top = 0.75       # never enter above 75% of swing range
fee_tvl_24h_min_pct = 0.08
fee_tvl_30m_daily_min_pct = 0.05
tvl_min_usd = 100000
tvl_max_usd = 10000000
vol_30m_min_usd = 5000
max_pool_share_pct = 5
size_sol = 0.75
max_position_sol = 1.5
max_slots = 1
deploy_cap_pct = 40
meme_reserve_slots = 2
stop_loss_frac = 0.60              # wider than meme 0.75 — spot holds inventory
escape_hatch_enabled = false       # meme escape logic; majors hold through dips
escape_hatch_depth_pct = 60
escape_hatch_recovery_pct = 25
below_range_grace_min = 120        # 2h grace below range (vs meme 15m)
claim_min_sol = 0.02
fee_compound = false               # bank only — no reinvest into position
profit_lock_enabled = false
max_age_h = 168
above_range_sustain_min = 240
above_range_missed_sustain_min = 480
# Entry floor is fee_tvl_30m_daily_min_pct (0.05). Rotation must sit meaningfully
# BELOW that (hysteresis) or a pool that still qualifies for re-entry churns all day.
# Was 0.05 — PUMP printed fee 0.02–0.05%/d with $5k–12k vol and rotated every ~15–45m.
rotation_fee_daily_min_pct = 0.02
rotation_vol_30m_min_usd = 1500
# Sustained decay before rotate (uses manage.poll_s). At poll_s=15, 120 ≈ 30 min.
# Meme stays at manage.rotation_polls=3. Majors also requires BOTH fee+vol dead (loop.ts).
rotation_polls = 120

[[majors.pools]]
pool = "HbjYfcWZBjCBYTJpZkLGxqArVmZVu3mQcRudb6Wg1sVh"
symbol = "PUMP"

[[majors.pools]]
pool = "6e7V9eegCHw997T72MxgwwJipZ6GJyZF8NvjkzT1rvpN"
symbol = "ANSEM"

# Optional whitelist seeds — discovery still finds the best live pool per symbol.
# Remove [[majors.pools]] entries entirely to rely on discovery + symbol_allowlist only.

[rotation]                 # capital agility: room for spectacular newcomers (§5)
alpha_slots = 1                  # slots reserved for score >= alpha_score_min only
alpha_score_min = 85
displacement_enabled = true      # full book + exceptional candidate -> close weakest
displacement_margin = 15         # candidate must beat weakest's CURRENT score by this
displacement_min_hold_min = 30   # positions younger than this are not displaceable
displacement_value_frac_min = 0.97  # never displace a position more than 3% underwater
displacement_max_per_6h = 2

[exec]                     # STRATEGY.md §3.6/§8
mode = "live"                    # paper | live (live also requires FARMER_MODE=live env)
# use_zap was removed in v0.11.0. Token->SOL on every close/claim/sweep goes
# through Jupiter's versioned /swap (multi-hop, lookup tables, dynamic CU) with
# escalating slippage — the path that has closed every live position. The old
# legacy direct-routes-only path was a strict subset of it and caused three
# incidents in three days. A stale use_zap key in this file is ignored.
exit_slippage_bps = 50
safety_exit_slippage_bps = 1000
tx_retries = 3
paper_promotion_days = 7
# --- Priority fee & compute budget (src/executor/priorityFee.ts) ---
# A prioritization fee is price × REQUESTED compute-unit limit, charged on what
# the tx asks for, not what it burns — so both halves are set deliberately.
# Fees are sampled for the accounts the tx actually writes (a network-wide
# median under-prices a contended pool, which is the only kind we transact on).
priority_fee_percentile = 75          # of NONZERO samples; the zero-fee majority
                                      # says nothing about the cost to compete
priority_fee_floor_microlamports = 10000    # ~0.000002 SOL at a 200k CU limit
priority_fee_cap_microlamports = 1000000    # ~0.0002 SOL at a 200k CU limit
priority_fee_retry_mult = 1.5         # per retry attempt; re-sending the same
                                      # fee cannot fix a fee-caused non-landing
compute_unit_margin_pct = 20          # over simulated consumption
compute_unit_fallback = 600000        # when simulation fails or reports nothing.
                                      # Only applies to tx WE build (zap swap,
                                      # unwrap, close-account) — the DLMM SDK
                                      # already sets its own simulated limit and
                                      # a second one would fail the tx.

# Product fee (not Settings-tunable): 1% of measured net profit on each winning
# close buys+burns GNME (BaDjVCpABEVCdt4LT7ivuzA4izBwJCqnDjrLa8XBtT38) in one
# Jupiter tx. Hardcoded in src/executor/profitBurn.ts — do not re-add as a knob.

[watchdog]
# rpc_blind_close_all was REMOVED on 2026-08-10, not set to false. The close-all
# branch is deleted from loop.ts, so re-enabling automated liquidation is a code
# change and a review rather than one TOML edit — which matters because
# config.ts catches a parse failure and silently keeps the previous config, so a
# safety property living only in this file is one bad edit from re-arming.
#
# Why it is gone: close()'s RPC read-set is a strict superset of mark()'s, so
# there is no state of the world where marks fail but closes succeed. The
# close-all could only ever complete when firing it was a mistake. A fallback
# connection does not fix that, it moves the requirement onto a less-trusted
# node — and a lagging node returning a stale-empty getProgramAccounts is the
# trigger for the worst write-off path in the codebase.
#
# Measured base rate: 2 failed marks in ~2,710 attempts, both 429s five log
# lines apart, longest blind streak ~30s against this 300s threshold. Never
# fired. Re-enable criteria are in the watchdog audit; the short version is a
# real recorded incident, a genuinely independent connection, a slot-freshness
# gate at the moment of action, and positions ~10x today's size.
rpc_blind_after_min = 5          # alert-only: freeze entries, never liquidate blind

[gmgn]                     # discovery enrichment via official gmgn-cli (query tier only)
enabled = true             # auto-off when GMGN_API_KEY is empty
intervals = ["5m", "1h"]   # trending windows checked each scan (1m is noise below our entry horizon)
min_liquidity_usd = 10000
# Tiered score bonus by which windows the token trends in (clamped at 100):
bonus_sustained = 8        # 5m AND 1h — momentum confirmed and holding
bonus_emerging = 4         # 5m only — catching fire now, not yet proven
bonus_fading = 3           # 1h only — was hot, current momentum decaying
require_renounced = true   # trending entry says mint/freeze not renounced -> pre-vet skip
# Rate limits: serial queue + **per-module** leaky buckets (market/token/track, rate=20).
# 60s spend cap + ban flushes queue — any call during 429 extends the ban (+5s each).
# Holders/traders weight=5 — staggered polls, trader tags off by default.
# On 429 park until reset_at; never retry. Two bots on one GMGN_API_KEY doubles load.

[apis]
meteora_datapi = "https://dlmm.datapi.meteora.ag"
rugcheck = "https://api.rugcheck.xyz"
jupiter_quote = "https://lite-api.jup.ag/swap/v1"
jupiter_price = "https://lite-api.jup.ag/price/v3"
jup_datapi = "https://datapi.jup.ag"       # undocumented (jup.ag UI backend) — soft signals only
geckoterminal = "https://api.geckoterminal.com/api/v2"  # deep candles (100 bars/call, keyless)

[candles]
# 2026-08-15: the Meteora datapi caps /ohlcv at 10 bars on EVERY timeframe (verified
# 5m/30m/1h/4h, no paging parameter helps). That silently starved every reader:
# majors RSI(14) was never computable ("rsi ?" on every line — the timing gate
# has been swing-only since it was written), the meme timing filter's "last
# hour" got 50 minutes, and the planner's "24h swing" was the last 10 bars.
# GeckoTerminal serves 100 bars keyless, keyed by pool address, and indexes pools
# minutes old. Datapi remains the fallback: never fewer bars than before.
deep_source_enabled = true
limit = 100            # bars per fetch (RSI needs 15+; ATH/swing want as many as possible)
max_per_min = 25       # GeckoTerminal public limit is 30/min; results are cached 60s
